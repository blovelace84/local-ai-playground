<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Playground</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            font-family: Segoe UI, Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        #app {
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            width: 100%;
            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }

        /* -------------------- Sidebar -------------------- */

        .sidebar {
            background: #111827;
            border-right: 1px solid #374151;
            padding: 20px;

            display: flex;
            flex-direction: column;

            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar-button {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        .sidebar-button:hover {
            background: #1d4ed8;
        }

        .sidebar-section {
            margin-top: 20px;
            color: #cbd5e1;
            min-height: 0;
        }

        .chat-list-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 4px;
            margin-bottom: 8px;
        }

        .chat-list-item {
            margin: 0;
            overflow: hidden;

            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .active-chat {
            background: #2563eb;
        }

        .chat-action-button {
            margin: 0;
            padding: 8px;
            background: transparent;
        }

        .chat-action-button:hover {
            background: #374151;
        }

        .model-section {
            margin-top: auto;
            flex-shrink: 0;
        }

        select {
            width: 100%;
            padding: 10px;

            border-radius: 8px;
            border: 1px solid #374151;

            background: #1f2937;
            color: white;
        }

        /* -------------------- Main Chat Area -------------------- */

        .chat-area {
            display: flex;
            flex-direction: column;

            width: 100%;
            height: 100vh;

            min-width: 0;
            min-height: 0;

            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-shrink: 0;

            padding: 16px clamp(16px, 3vw, 32px);

            border-bottom: 1px solid #374151;
            background: #111827;
        }

        .topbar > div:first-child {
            min-width: 0;
        }

        .topbar h1 {
            margin: 0 0 4px;
            font-size: clamp(20px, 2vw, 28px);
        }

        .topbar p {
            margin: 0;
            overflow: hidden;
            color: #94a3b8;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .active-model-pill {
            flex: 0 0 auto;
            padding: 8px 12px;
            border: 1px solid #374151;
            border-radius: 999px;
            background: #1f2937;
            color: #cbd5e1;
            font-size: 13px;
        }

        /*
            This is the important section.

            min-height: 0 allows this flex item to use only the
            available space instead of forcing the page taller.

            overflow-y: auto means ONLY the messages scroll.
        */
        .chat-box {
            flex: 1 1 auto;

            min-width: 0;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: clamp(16px, 3vw, 32px);

            background: #0f172a;

            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .chat-box::-webkit-scrollbar {
            display: none;
        }

        /* -------------------- Messages -------------------- */

        .message-row {
            display: flex;
            gap: 10px;

            margin-bottom: 18px;

            align-items: flex-start;
        }

        .user-row {
            justify-content: flex-end;
        }

        .ai-row {
            justify-content: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;

            flex: 0 0 32px;

            border-radius: 999px;

            background: #1f2937;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-row .avatar {
            order: 2;
        }

        .message {
            width: fit-content;
            max-width: min(75%, 720px);
            min-width: 0;

            margin-bottom: 16px;
            padding: 14px;

            border-radius: 12px;

            overflow-wrap: anywhere;
        }

        .user {
            margin-left: auto;
            background: #2563eb;
        }

        .ai {
            margin-right: auto;
            background: #1f2937;
        }

        .message-label {
            margin-bottom: 6px;

            font-size: 12px;
            font-weight: bold;

            color: #d1d5db;
        }

        .message-content {
            white-space: pre-wrap;
            line-height: 1.5;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* -------------------- Input -------------------- */

        .input-area {
            flex-shrink: 0;

            padding: 20px;

            border-top: 1px solid #374151;
            background: #111827;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            max-height: 180px;

            resize: vertical;

            padding: 12px;

            border-radius: 10px;
            border: 1px solid #374151;

            background: #1f2937;
            color: white;

            font-size: 15px;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        /* -------------------- Buttons -------------------- */

        button {
            margin-top: 12px;
            padding: 12px 20px;

            border: none;
            border-radius: 8px;

            background: #22c55e;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .secondary-button {
            background: #374151;
        }

        .secondary-button:hover {
            background: #4b5563;
        }

        /* -------------------- States -------------------- */

        .empty-state {
            color: #94a3b8;
            text-align: center;
            margin-top: 100px;
        }

        .error-message {
            margin-bottom: 16px;
            padding: 12px;

            border: 1px solid #ef4444;
            border-radius: 8px;

            background: #450a0a;
            color: #fecaca;
        }

        @media (max-width: 640px) {
            .layout {
                grid-template-columns: 200px minmax(0, 1fr);
            }

            .sidebar,
            .input-area {
                padding: 16px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script type="module" src="/ui/app.js"></script>
</body>

</html>
