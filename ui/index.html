<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Playground</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .stop-button {
            background: #dc2626
        }

        .stop-button:hover {
            background: #b91c1c;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            font-family: Segoe UI, Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        #app {
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            width: 100%;
            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }

        /* -------------------- Sidebar -------------------- */

        .sidebar {
            background: #111827;
            border-right: 1px solid #374151;
            padding: 20px;

            display: flex;
            flex-direction: column;

            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar-button {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        .sidebar-button:hover {
            background: #1d4ed8;
        }

        .sidebar-section {
            margin-top: 20px;
            color: #cbd5e1;
            min-height: 0;
        }

        .chat-list-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 4px;
            margin-bottom: 8px;
        }

        .chat-list-item {
            margin: 0;
            overflow: hidden;

            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .active-chat {
            background: #2563eb;
        }

        .chat-action-button {
            margin: 0;
            padding: 8px;
            background: transparent;
        }

        .chat-action-button:hover {
            background: #374151;
        }

        .model-section {
            margin-top: auto;
            flex-shrink: 0;
        }

        select {
            width: 100%;
            padding: 10px;

            border-radius: 8px;
            border: 1px solid #374151;

            background: #1f2937;
            color: white;
        }

        /* -------------------- Main Chat Area -------------------- */

        .chat-area {
            display: flex;
            flex-direction: column;

            width: 100%;
            height: 100vh;

            min-width: 0;
            min-height: 0;

            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-shrink: 0;

            padding: 16px clamp(16px, 3vw, 32px);

            border-bottom: 1px solid #374151;
            background: #111827;
        }

        .topbar > div:first-child {
            min-width: 0;
        }

        .topbar h1 {
            margin: 0 0 4px;
            font-size: clamp(20px, 2vw, 28px);
        }

        .topbar p {
            margin: 0;
            overflow: hidden;
            color: #94a3b8;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .active-model-pill {
            flex: 0 0 auto;
            padding: 8px 12px;
            border: 1px solid #374151;
            border-radius: 999px;
            background: #1f2937;
            color: #cbd5e1;
            font-size: 13px;
        }

        /*
            This is the important section.

            min-height: 0 allows this flex item to use only the
            available space instead of forcing the page taller.

            overflow-y: auto means ONLY the messages scroll.
        */
        .chat-box {
            flex: 1 1 auto;

            min-width: 0;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: clamp(16px, 3vw, 32px);

            background: #0f172a;

            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .chat-box::-webkit-scrollbar {
            display: none;
        }

        /* -------------------- Messages -------------------- */

        .message-row {
            display: flex;
            gap: 6px;

            width: min(100%, 920px);
            margin: 0 auto 6px;

            align-items: flex-start;
        }

        .user-row {
            justify-content: flex-end;
        }

        .ai-row {
            justify-content: flex-start;
        }

        .avatar {
            width: 28px;
            height: 28px;

            flex: 0 0 28px;

            border-radius: 999px;

            border: 1px solid #334155;
            background: #1e293b;
            box-shadow: 0 4px 12px rgb(2 6 23 / 18%);
            font-size: 13px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-row .avatar {
            order: 2;
        }

        .user-row .avatar {
            border-color: #3b82f6;
            background: #1d4ed8;
        }

        .message {
            display: flex;
            flex: 0 1 min(78%, 760px);
            flex-direction: column;
            min-width: 0;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .message-label {
            margin: 0 8px 2px;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
            text-transform: uppercase;
        }

        .message.user .message-label {
            color: #93c5fd;
        }

        .message-content {
            box-sizing: border-box;
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 18px;
            background: #1e293b;
            box-shadow: 0 8px 24px rgb(2 6 23 / 18%);
            color: #e2e8f0;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.user .message-content {
            border-color: #2563eb;
            border-bottom-right-radius: 6px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #eff6ff;
        }

        .message.ai .message-content {
            border-bottom-left-radius: 6px;
        }

/* Prevent extra Markdown paragraph spacing */
.message-content p {
  margin: 0 0 8px;
}

.message-content p:last-child {
  margin-bottom: 0;
}

/* Remove unexpected top spacing */
.message-content > :first-child {
  margin-top: 0;
}

.message-content > :last-child {
  margin-bottom: 0;
}


        .message-content {
            white-space: pre-wrap;
            line-height: 1.5;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* -------------------- Input -------------------- */

        .input-area {
            flex-shrink: 0;

            padding: 20px;

            border-top: 1px solid #374151;
            background: #111827;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            max-height: 180px;

            resize: vertical;

            padding: 12px;

            border-radius: 10px;
            border: 1px solid #374151;

            background: #1f2937;
            color: white;

            font-size: 15px;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        /* -------------------- Buttons -------------------- */

        button {
            margin-top: 12px;
            padding: 12px 20px;

            border: none;
            border-radius: 8px;

            background: #22c55e;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .secondary-button {
            background: #374151;
        }

        .secondary-button:hover {
            background: #4b5563;
        }

        /* -------------------- States -------------------- */

        .empty-state {
            color: #94a3b8;
            text-align: center;
            margin-top: 100px;
        }

        .error-message {
            margin-bottom: 16px;
            padding: 12px;

            border: 1px solid #ef4444;
            border-radius: 8px;

            background: #450a0a;
            color: #fecaca;
        }

        @media (max-width: 640px) {
            .message {
                flex-basis: 88%;
                max-width:88%;
            }

            .message-row {
                gap: 8px;
                margin-bottom: 18px;
            }

            .message-content {
                padding: 12px 14px;
            }
        }

        .message-content {
    line-height: 1.6;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.message-content p {
    margin: 0 0 8px;
}

.message-content p:last-child {
    margin-bottom: 0;
}

.message.user .message-content p,
.message.user .message-content li {
    color: inherit;
}

.message-actions {
    display: flex;
    gap: 8px;
}

.message-content h1,
.message-content h2,
.message-content h3 {
    margin-top: 18px;
    margin-bottom: 10px;
    line-height: 1.25;
}

.message-content h1:first-child,
.message-content h2:first-child,
.message-content h3:first-child {
    margin-top: 0;
}

.message-content h1 {
    font-size: 1.5rem;
}

.message-content h2 {
    font-size: 1.3rem;
}

.message-content h3 {
    font-size: 1.1rem;
}

.message-content ul,
.message-content ol {
    margin: 10px 0 14px;
    padding-left: 24px;
}

.message-content li {
    margin: 5px 0;
}

.message-content strong {
    font-weight: 700;
}

.message-content em {
    font-style: italic;
}

.message-content a {
    color: #60a5fa;
    text-decoration: underline;
}

.message-content a:hover {
    color: #93c5fd;
}

.message-content blockquote {
    margin: 12px 0;
    padding: 8px 14px;

    border-left: 3px solid #64748b;

    background: #111827;
    color: #cbd5e1;
}

.message-content code {
    padding: 2px 6px;

    border-radius: 5px;

    background: #0f172a;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 0.9em;
}

.message-content pre {
    margin: 14px 0;
    padding: 14px;

    overflow-x: auto;

    border: 1px solid #374151;
    border-radius: 8px;

    background: #020617;
}

.message-content pre code {
    padding: 0;
    background: transparent;

    white-space: pre;
}

    .code-block {
    margin: 14px 0;
    overflow: hidden;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #020617;
}

.code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid #334155;
    background: #1e293b;
}

.code-language {
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
}

.message-content .code-block pre {
    margin: 0;
    border: none;
    border-radius: 0;
    background: transparent;
}

.message-content .code-block code {
    display: block;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre;
}

.copy-code-button {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    margin: 0;
    padding: 5px 10px;

    border: 1px solid #475569;
    border-radius: 6px;

    background: #334155;
    color: #e2e8f0;

    font-size: 12px;
    cursor: pointer;
}

.copy-code-button:hover {
    background: #475569;
}

.copy-code-button.copied {
    border-color: #22c55e;
    color: #86efac;
}

.copy-code-icon {
    font-size: 14px;
}

.regenerate-button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 6px 10px;
    border: 1px solid #475569;
    border-radius: 6px;
    background: #334155;
    color: #e2e8f0;
    font-size: 11px;
    cursor: pointer;
}

.edit-message-button {
    margin-top: 6px;
    padding: 6px 10px;
    border: 1px solid #475569;
    border-radius: 6px;
    background: transparent;
    color: #cbd5e1;
    font-size: 11px;
}

.edit-message-button:hover {
    background: #334155;
    color: #f8fafc;
}

.regenerate-button:hover {
    background: #475569;
}

.regenerate-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}


.inline-message-editor {
    width: 100%;
    min-width: 0;
}

.inline-edit-textarea {
  width: 100%;
  min-height: 110px;
  padding: 12px;
  border: 1px solid #64748b;
  border-radius: 8px;
  background: #0f172a;
  color: #f8fafc;
  font: inherit;
  line-height: 1.5;
  resize: vertical;
  box-sizing: border-box;
}

.inline-edit-textarea:focus {
  outline: 2px solid #60a5fa;
  outline-offset: 1px;
}

.inline-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.inline-edit-actions button {
  padding: 8px 14px;
  border-radius: 7px;
  border: 1px solid #64748b;
  cursor: pointer;
}

.inline-edit-actions button:last-child {
  background: #16a34a;
  color: white;
  border-color: #16a34a;
}

    </style>
</head>

<body>
    <div id="app"></div>

    <script type="module" src="/ui/app.js"></script>
</body>

</html>
